<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anonymous Messenger</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfnDGzS2QJyWDNPQl2LuO--GOxPAf7uxQ",
            authDomain: "personal-message-379b4.firebaseapp.com",
            databaseURL: "https://personal-message-379b4-default-rtdb.firebaseio.com",
            projectId: "personal-message-379b4",
            storageBucket: "personal-message-379b4.firebasestorage.app",
            messagingSenderId: "861066018093",
            appId: "1:861066018093:web:8ae48c3f9d5e9b3223a7a4",
            measurementId: "G-NXP3HRYQXG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ENCRYPTION_KEY = "BangladeshAnonymous2024SecureChatKey!@#";

        async function getKey() {
            const encoder = new TextEncoder();
            const keyData = encoder.encode(ENCRYPTION_KEY);
            const hash = await crypto.subtle.digest('SHA-256', keyData);
            return await crypto.subtle.importKey('raw', hash, 'AES-GCM', false, ['encrypt', 'decrypt']);
        }

        async function encryptMessage(text) {
            const key = await getKey();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
            const combined = new Uint8Array(iv.length + encrypted.byteLength);
            combined.set(iv);
            combined.set(new Uint8Array(encrypted), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptMessage(encryptedText) {
            try {
                const key = await getKey();
                const combined = Uint8Array.from(atob(encryptedText), c => c.charCodeAt(0));
                const iv = combined.slice(0, 12);
                const data = combined.slice(12);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                const decoder = new TextDecoder();
                return decoder.decode(decrypted);
            } catch (e) {
                return "🔒 Encrypted";
            }
        }

        let currentUser = null;
        let isAdmin = false;
        let selectedUser = null;
        let unsubscribers = [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts.toDate ? ts.toDate() : ts);
            return d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function showToast(msg, type = 'info') {
            const bg = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-blue-500';
            const t = document.createElement('div');
            t.className = `fixed top-4 left-1/2 -translate-x-1/2 ${bg} text-white px-5 py-3 rounded-full shadow-2xl z-[100] text-sm font-medium animate-toast`;
            t.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'} mr-2"></i>${msg}`;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(-20px)'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        // ========== LOGIN ==========
        document.getElementById('loginBtn').addEventListener('click', handleLogin);
        document.getElementById('usernameInput').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });

        function handleLogin() {
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            if (!username) { showToast('Username দিন!', 'error'); return; }
            currentUser = username;
            isAdmin = username === 'admin';
            document.getElementById('loginScreen').classList.add('hidden');
            if (isAdmin) {
                document.getElementById('adminScreen').classList.remove('hidden');
                loadAdminPanel();
            } else {
                document.getElementById('userScreen').classList.remove('hidden');
                loadUserChat();
            }
        }

        document.getElementById('userLogout').addEventListener('click', () => location.reload());
        document.getElementById('adminLogout').addEventListener('click', () => location.reload());

        // ========== USER CHAT ==========
        async function loadUserChat() {
            unsubscribers.forEach(u => u());
            unsubscribers = [];

            const q = query(collection(db, 'messages'), where('participants', 'array-contains', currentUser));

            const unsub = onSnapshot(q, async (snapshot) => {
                const container = document.getElementById('userMessages');
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-slate-400 select-none px-4">
                            <div class="w-16 h-16 rounded-full bg-slate-800/80 flex items-center justify-center mb-3 ring-2 ring-slate-700/50">
                                <i class="fas fa-lock text-2xl text-slate-600"></i>
                            </div>
                            <p class="text-base font-medium text-slate-300">End-to-End Encrypted</p>
                            <p class="text-sm mt-1 text-slate-500 text-center">Admin কে আপনার প্রথম message পাঠান</p>
                        </div>`;
                    return;
                }

                const docs = snapshot.docs.sort((a, b) => {
                    const ta = a.data().timestamp?.toMillis?.() || 0;
                    const tb = b.data().timestamp?.toMillis?.() || 0;
                    return ta - tb;
                });

                let lastDate = '';
                for (const docSnap of docs) {
                    const data = docSnap.data();
                    const text = await decryptMessage(data.encryptedText);
                    const isMe = data.sender === currentUser;
                    const time = formatTime(data.timestamp);

                    const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString('bn-BD', {day:'numeric', month:'short', year:'numeric'}) : '';
                    if (date && date !== lastDate) {
                        lastDate = date;
                        container.innerHTML += `<div class="flex justify-center my-4"><span class="date-pill">${date}</span></div>`;
                    }

                    const div = document.createElement('div');
                    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-2 px-3 md:px-5`;
                    div.innerHTML = `
                        <div class="max-w-[85%] md:max-w-[65%] ${isMe ? 'bubble-sent' : 'bubble-received'} px-3.5 py-2 shadow-sm animate-msg-in">
                            <p class="text-[15px] leading-snug">${escapeHtml(text)}</p>
                            <div class="flex items-center justify-end gap-1 mt-0.5">
                                <span class="text-[10px] opacity-60 font-medium">${time}</span>
                                ${isMe ? '<i class="fas fa-check-double text-[10px] opacity-60 ml-0.5"></i>' : ''}
                            </div>
                        </div>`;
                    container.appendChild(div);
                }
                container.scrollTop = container.scrollHeight;
            }, err => { console.error(err); showToast('Connection error', 'error'); });

            unsubscribers.push(unsub);
        }

        // ========== SEND MESSAGE (Keyboard stays open!) ==========
        document.getElementById('userSendBtn').addEventListener('click', sendUserMsg);
        document.getElementById('userMsgInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendUserMsg(); });

        async function sendUserMsg() {
            const input = document.getElementById('userMsgInput');
            const text = input.value.trim();
            if (!text) return;
            const enc = await encryptMessage(text);
            try {
                await addDoc(collection(db, 'messages'), {
                    sender: currentUser, receiver: 'admin',
                    participants: [currentUser, 'admin'],
                    encryptedText: enc, timestamp: serverTimestamp(), read: false
                });
                input.value = '';
                // FIX: Keep keyboard open by focusing back
                setTimeout(() => input.focus(), 50);
            } catch (e) { showToast('Send failed', 'error'); }
        }

        // ========== ADMIN PANEL ==========
        async function loadAdminPanel() {
            unsubscribers.forEach(u => u());
            unsubscribers = [];

            const q = query(collection(db, 'messages'));
            const unsub = onSnapshot(q, async (snapshot) => {
                const users = new Map();
                snapshot.docs.forEach(doc => {
                    const d = doc.data();
                    const other = d.sender === 'admin' ? d.receiver : d.sender;
                    if (other !== 'admin' && !users.has(other)) {
                        users.set(other, { username: other, lastMsg: d.encryptedText, ts: d.timestamp });
                    }
                });

                const list = document.getElementById('adminUserList');
                list.innerHTML = '';

                if (users.size === 0) {
                    list.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-48 text-slate-500 px-4">
                            <i class="fas fa-inbox text-3xl mb-2 opacity-20"></i>
                            <p class="text-sm">কোনো conversation নেই</p>
                            <p class="text-xs mt-1 opacity-50">কেউ message পাঠালে এখানে দেখাবে</p>
                        </div>`;
                    return;
                }

                for (const [_, u] of users) {
                    const decrypted = await decryptMessage(u.lastMsg);
                    const time = formatTime(u.ts);
                    const el = document.createElement('div');
                    el.className = `user-item ${selectedUser === u.username ? 'active' : ''}`;
                    el.onclick = () => openAdminChat(u.username);
                    el.innerHTML = `
                        <div class="avatar shrink-0">${u.username.charAt(0).toUpperCase()}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline mb-0.5">
                                <h3 class="font-semibold text-slate-200 truncate text-[15px]">${u.username}</h3>
                                <span class="text-[11px] text-slate-500 shrink-0">${time}</span>
                            </div>
                            <p class="text-sm text-slate-400 truncate">${escapeHtml(decrypted)}</p>
                        </div>`;
                    list.appendChild(el);
                }
            });
            unsubscribers.push(unsub);
        }

        async function openAdminChat(username) {
            selectedUser = username;
            document.getElementById('adminChatHeader').textContent = username;
            document.getElementById('adminChatHeaderAvatar').textContent = username.charAt(0).toUpperCase();

            if (window.innerWidth < 768) {
                document.getElementById('adminSidebar').classList.add('mobile-hidden');
                document.getElementById('adminChatArea').classList.remove('mobile-hidden');
                document.getElementById('adminChatArea').classList.add('mobile-show');
            }

            document.getElementById('adminChatArea').classList.remove('hidden');
            document.getElementById('adminEmptyState').classList.add('hidden');

            unsubscribers.forEach(u => u());
            unsubscribers = [];

            const q = query(collection(db, 'messages'), where('participants', 'array-contains', username));
            const unsub = onSnapshot(q, async (snapshot) => {
                const container = document.getElementById('adminMessages');
                container.innerHTML = '';

                const docs = snapshot.docs.sort((a, b) => {
                    const ta = a.data().timestamp?.toMillis?.() || 0;
                    const tb = b.data().timestamp?.toMillis?.() || 0;
                    return ta - tb;
                });

                let lastDate = '';
                for (const docSnap of docs) {
                    const data = docSnap.data();
                    const text = await decryptMessage(data.encryptedText);
                    const isAdmin = data.sender === 'admin';
                    const time = formatTime(data.timestamp);

                    const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString('bn-BD', {day:'numeric', month:'short', year:'numeric'}) : '';
                    if (date && date !== lastDate) {
                        lastDate = date;
                        container.innerHTML += `<div class="flex justify-center my-4"><span class="date-pill">${date}</span></div>`;
                    }

                    const div = document.createElement('div');
                    div.className = `flex ${isAdmin ? 'justify-end' : 'justify-start'} mb-2 px-3 md:px-5`;
                    div.innerHTML = `
                        <div class="max-w-[85%] md:max-w-[65%] ${isAdmin ? 'bubble-sent' : 'bubble-received'} px-3.5 py-2 shadow-sm animate-msg-in">
                            <p class="text-[15px] leading-snug">${escapeHtml(text)}</p>
                            <div class="flex items-center justify-end gap-1 mt-0.5">
                                <span class="text-[10px] opacity-60 font-medium">${time}</span>
                                ${isAdmin ? '<i class="fas fa-check-double text-[10px] opacity-60 ml-0.5"></i>' : ''}
                            </div>
                        </div>`;
                    container.appendChild(div);
                }
                container.scrollTop = container.scrollHeight;
            });
            unsubscribers.push(unsub);
        }

        // ========== ADMIN SEND (Keyboard stays open!) ==========
        document.getElementById('adminSendBtn').addEventListener('click', sendAdminReply);
        document.getElementById('adminMsgInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendAdminReply(); });

        async function sendAdminReply() {
            if (!selectedUser) { showToast('User select করুন!', 'error'); return; }
            const input = document.getElementById('adminMsgInput');
            const text = input.value.trim();
            if (!text) return;
            const enc = await encryptMessage(text);
            try {
                await addDoc(collection(db, 'messages'), {
                    sender: 'admin', receiver: selectedUser,
                    participants: [selectedUser, 'admin'],
                    encryptedText: enc, timestamp: serverTimestamp(), read: false
                });
                input.value = '';
                // FIX: Keep keyboard open by focusing back
                setTimeout(() => input.focus(), 50);
            } catch (e) { showToast('Reply failed', 'error'); }
        }

        document.getElementById('mobileBackBtn').addEventListener('click', () => {
            document.getElementById('adminChatArea').classList.add('mobile-hidden');
            document.getElementById('adminChatArea').classList.remove('mobile-show');
            document.getElementById('adminSidebar').classList.remove('mobile-hidden');
            selectedUser = null;
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                document.getElementById('adminSidebar').classList.remove('mobile-hidden');
                if (selectedUser) {
                    document.getElementById('adminChatArea').classList.remove('hidden');
                }
            } else {
                if (!selectedUser) {
                    document.getElementById('adminSidebar').classList.remove('mobile-hidden');
                    document.getElementById('adminChatArea').classList.add('hidden');
                    document.getElementById('adminChatArea').classList.remove('mobile-show');
                }
            }
        });

    </script>

        @media (min-width: 768px) {

            max-height: 120px;
            -webkit-appearance: none;

        .sidebar-header {

        .admin-chat {

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ========== ANIMATIONS ========== */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-msg-in { animation: msgIn 0.2s ease-out; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .animate-toast { animation: toastIn 0.3s ease-out; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.4s ease-out; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .empty-state-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            border: 2px solid rgba(255,255,255,0.04);
        }

        @media (min-width: 768px) {
            .empty-state-icon { width: 72px; height: 72px; }
        }

        .no-select { user-select: none; -webkit-user-select: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ========== LOGIN SCREEN ========== -->
    <div id="loginScreen" class="login-screen">
        <div class="glass-card animate-fade-up">
            <div class="text-center mb-6">
                <div class="w-16 h-16 md:w-20 md:h-20 mx-auto bg-gradient-to-br from-emerald-500 via-teal-500 to-blue-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/20">
                    <i class="fas fa-user-secret text-2xl md:text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Anonymous Chat</h1>
                <p class="text-slate-400 mt-1 text-sm">End-to-End Encrypted</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1.5">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input 
                            id="usernameInput" 
                            type="text" 
                            placeholder="যেমন: rahat, user123, admin"
                            class="w-full bg-slate-800/60 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30 transition-all text-base"
                            autocomplete="off"
                            autocapitalize="off"
                        >
                    </div>
                </div>

                <button 
                    id="loginBtn" 
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-3 rounded-xl transition-all transform active:scale-[0.98] shadow-lg shadow-emerald-500/20 text-base"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>Login করুন
                </button>
            </div>

            <div class="mt-5 text-center space-y-1.5">
                <p class="text-xs text-slate-500">
                    <i class="fas fa-shield-alt mr-1 text-emerald-500"></i>
                    Admin: <span class="text-emerald-400 font-mono font-semibold">admin</span>
                </p>
                <p class="text-[11px] text-slate-600">Personal use • Fully Encrypted</p>
            </div>
        </div>
    </div>

    <!-- ========== USER CHAT SCREEN ========== -->
    <div id="userScreen" class="hidden app-root">
        <!-- Header -->
        <div class="chat-header no-select">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center">
                    <i class="fas fa-headset text-white text-xs md:text-sm"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-white text-[15px] md:text-base">Admin</h2>
                    <p class="text-xs text-emerald-400 flex items-center gap-1.5">
                        <span class="status-dot"></span>
                        Online
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="hidden md:inline-flex text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20 font-medium items-center">
                    <i class="fas fa-lock text-[10px] mr-1.5"></i>Encrypted
                </span>
                <button id="userLogout" class="text-slate-400 hover:text-red-400 transition-colors p-2 -mr-2">
                    <i class="fas fa-sign-out-alt text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="userMessages" class="messages-scroll custom-scroll">
        </div>

        <!-- Input -->
        <div class="input-bar">
            <div class="flex gap-2.5 max-w-5xl mx-auto items-end">
                <input 
                    id="userMsgInput" 
                    type="text" 
                    placeholder="Message লিখুন..."
                    class="msg-input"
                    autocomplete="off"
                    autocapitalize="off"
                >
                <button 
                    id="userSendBtn" 
                    class="send-btn"
                >
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ========== ADMIN SCREEN ========== -->
    <div id="adminScreen" class="hidden admin-layout">
        <!-- Sidebar -->
        <div id="adminSidebar" class="sidebar">
            <div class="sidebar-header no-select">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center">
                            <i class="fas fa-crown text-white text-xs md:text-sm"></i>
                        </div>
                        <div>
                            <h2 class="font-semibold text-white text-[15px]">Admin Panel</h2>
                            <p class="text-xs text-slate-400">All conversations</p>
                        </div>
                    </div>
                    <button id="adminLogout" class="text-slate-400 hover:text-red-400 transition-colors p-2">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search text-slate-500 text-sm"></i>
                    <input type="text" placeholder="Search users...">
                </div>
            </div>

            <div id="adminUserList" class="user-list custom-scroll">
            </div>
        </div>

        <!-- Chat Area -->
        <div class="admin-chat">
            <!-- Empty State -->
            <div id="adminEmptyState" class="flex-1 flex items-center justify-center">
                <div class="text-center text-slate-500 select-none px-4">
                    <div class="empty-state-icon">
                        <i class="fas fa-comments text-3xl text-slate-600"></i>
                    </div>
                    <p class="text-lg font-medium text-slate-300 mb-1">Anonymous Messenger</p>
                    <p class="text-sm text-slate-500">Left sidebar থেকে user select করুন</p>
                </div>
            </div>

            <!-- Active Chat -->
            <div id="adminChatArea" class="hidden app-root">
                <!-- Chat Header -->
                <div class="chat-header no-select">
                    <div class="flex items-center gap-2.5 md:gap-3">
                        <button id="mobileBackBtn" class="md:hidden text-slate-400 hover:text-white p-1 -ml-1">
                            <i class="fas fa-arrow-left text-lg"></i>
                        </button>
                        <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-bold text-sm md:text-base" id="adminChatHeaderAvatar">
                            U
                        </div>
                        <div>
                            <h3 class="font-semibold text-white text-[15px] md:text-base" id="adminChatHeader">User</h3>
                            <p class="text-xs text-slate-400">Anonymous</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="hidden md:inline-flex text-xs bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-full border border-emerald-500/20 items-center">
                            <i class="fas fa-circle text-[8px] mr-1.5"></i>Active
                        </span>
                    </div>
                </div>

                <!-- Messages -->
                <div id="adminMessages" class="messages-scroll custom-scroll">
                </div>

                <!-- Input -->
                <div class="input-bar">
                    <div class="flex gap-2.5 max-w-5xl mx-auto items-end">
                        <input 
                            id="adminMsgInput" 
                            type="text" 
                            placeholder="Reply লিখুন..."
                            class="msg-input"
                            autocomplete="off"
                            autocapitalize="off"
                        >
                        <button 
                            id="adminSendBtn" 
                            class="send-btn"
                        >
                            <i class="fas fa-reply text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
